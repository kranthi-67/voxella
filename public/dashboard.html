<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feed | VOXELLA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css"><script src="js/appearance.js"></script><link rel="stylesheet" href="css/market.css">
</head>
<body>
<main class="vxPage"><div class="vxWrap feedLayout">
  <section aria-label="Feed">
    <div class="tabs" style="margin-bottom:16px"><button id="tabForYou" class="on" type="button">For you</button><button id="tabLatest" type="button">Latest</button></div>
    <div id="composer"></div>
    <div id="posts"></div>
    <div class="loadMore"><button id="more" class="vxBtn line" type="button" hidden>Load more</button></div>
  </section>
  <aside class="side" aria-label="Discover">
    <div class="vxCard"><h3>Open for commissions</h3><div id="openArtists"></div><a class="vxBtn soft sm block" href="explore.html?tab=artists&open=1" style="margin-top:10px">See all artists</a></div>
    <div class="vxCard"><h3>Browse by category</h3><div class="chipRow">
      <a class="vxChip" href="explore.html?category=drawing">Drawing</a>
      <a class="vxChip" href="explore.html?category=design">Design</a>
      <a class="vxChip" href="explore.html?category=3d-model">3D models</a>
      <a class="vxChip" href="explore.html?forSale=1">For sale</a></div></div>
    <p class="vxMuted" style="font-size:12.5px;padding:0 6px">Spotted something suspicious? Use Report on a profile. Every report is reviewed.</p>
  </aside>
</div></main>
<script src="js/shell.js"></script><script src="js/cards.js"></script><script src="js/posts-ui.js"></script><script src="js/compose.js"></script><script src="js/feed.js"></script>
</body></html>
