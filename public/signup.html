<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account • VOXELLA</title>

    <link rel="stylesheet" href="css/signup.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="backgroundGlow"></div>

<div class="signupCard">

    <img src="assets/logo.png" class="logo">

    <h1>Create Account</h1>

    <p class="subtitle">
        Meet new people, make friends and build communities.<br>
        Your conversations stay private, your identity stays yours.
    </p>

    <form id="signupForm">

        <label>Display Name</label>

        <input
            type="text"
            id="displayName"
            placeholder="NightWolf"
            required>

        <!-- NEW EMAIL FIELD -->

        <label>Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="nightwolf@example.com"
            required>

        <label>Username</label>

        <input
            type="text"
            id="username"
            placeholder="nightwolf"
            required>

        <div class="previewCard">

            <img src="assets/logo.png" class="previewLogo">

            <h3 id="previewDisplayName">
                Display Name
            </h3>

            <p id="usernamePreview">
                @username
            </p>

        </div>

        <label>Password</label>

        <div class="passwordBox">

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required>

            <span id="togglePassword">👁</span>

        </div>

        <label>Confirm Password</label>

        <div class="passwordBox">

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required>

            <span id="toggleConfirm">👁</span>

        </div>

        <div id="error"></div>

        <button type="submit">

            Create Account

        </button>

    </form>

    <div class="loginLink">

        Already have an account?

        <a href="login.html">

            Login

        </a>

    </div>

</div>

<script src="js/signup.js"></script>

</body>

</html>
