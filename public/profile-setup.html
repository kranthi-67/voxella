<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile • VOXELLA</title>

    <link rel="stylesheet" href="css/profile-setup.css">

</head>

<body>

<div class="editor">

    <h1>Edit Profile</h1>

    <!-- Avatar -->

    <label>Avatar</label>

    <input
        type="file"
        id="avatarInput"
        accept=".png,.jpg,.jpeg,.webp,.gif">

    <img
        id="avatarPreview"
        src="assets/defaultavatar.png"
        width="120"
        height="120"
        style="
            display:block;
            margin:15px 0;
            border-radius:50%;
            object-fit:cover;
            border:3px solid #5865F2;
        ">

    <button id="removeAvatar" type="button" class="remove-btn">Remove profile picture</button>

    <!-- Banner -->

    <label>Banner</label>

    <input
        type="file"
        id="bannerInput"
        accept=".png,.jpg,.jpeg,.webp,.gif">

    <img
        id="bannerPreview"
        src="assets/defaultbanner.png"
        width="420"
        height="120"
        style="
            display:block;
            margin:15px 0;
            object-fit:cover;
            border-radius:12px;
        ">

    <button id="removeBanner" type="button" class="remove-btn">Remove banner</button>

    <!-- Background -->

    <label>Background</label>

    <input
        type="file"
        id="backgroundInput"
        accept=".png,.jpg,.jpeg,.webp,.gif">

    <button id="removeBackground" type="button" class="remove-btn">Remove background</button>

    <img
        id="backgroundPreview"
        src=""
        width="420"
        height="180"
        style="
            display:block;
            margin:15px 0;
            object-fit:cover;
            border-radius:12px;
        ">

    <!-- Profile Theme -->

    <label>Profile Theme</label>

    <select id="theme">
        <option value="Crimson">❤️ Crimson</option>
        <option value="Galaxy">🌌 Galaxy</option>
        <option value="Ocean">🌊 Ocean</option>
        <option value="Forest">🌲 Forest</option>
        <option value="Sunset">🌇 Sunset</option>
        <option value="AMOLED">🌙 AMOLED</option>
        <option value="Glass">💎 Glass</option>
        <option value="Midnight">⚫ Midnight</option>
        <option value="Nebula">✨ Nebula</option>
        <option value="Aurora">🌈 Aurora</option>
        <option value="Pixel">🟦 Pixel</option>
        <option value="Synthwave">Synthwave</option>
        <option value="Matrix">Matrix</option>
        <option value="Candy">Candy</option>
        <option value="Solar">Solar</option>
        <option value="Frost">Frost</option>
        <option value="Cyber">Cyber</option>
        <option value="Sakura">Sakura</option>
        <option value="Volcano">Volcano</option>
        <option value="Monsoon">Monsoon</option>
        <option value="Ember">Ember</option>
        <option value="Prism">Prism</option>
        <option value="Neon Arena">Neon Arena</option>
        <option value="Phantom">Phantom</option>
        <option value="Kawaii">Kawaii</option>
        <option value="Shonen">Shonen</option>
        <option value="Mecha">Mecha</option>
    </select>

    <!-- Status -->

    <label>Status</label>

    <select id="status">

        <option>Online</option>
        <option>Idle</option>
        <option>DND</option>
        <option>Invisible</option>
        <option>Gaming</option>
        <option>Chill</option>

    </select>

    <label>Status note</label>

    <input
        type="text"
        id="statusNote"
        maxlength="120"
        placeholder="What are you up to?">

    <label>Keep note for</label>

    <select id="statusNoteDuration">
        <option value="24h">24 hours</option>
        <option value="3d">3 days</option>
    </select>

    <!-- Pronouns -->

    <label>Pronouns</label>

    <input
        type="text"
        id="pronouns"
        maxlength="30"
        placeholder="he/him">

    <!-- Bio -->

    <label>Bio</label>

    <textarea
        id="bio"
        maxlength="150"
        placeholder="Tell everyone something about yourself..."></textarea>

    <button id="saveProfile">
        Save Profile
    </button>

</div>

<script src="js/profile-setup.js"></script>

</body>

</html>
